
name: Tes Mesin Video DCD

on:
  workflow_dispatch:

jobs:
  tes-ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - name: Instal FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Periksa FFmpeg
        run: |
          ffmpeg -version
          echo "Mesin DCD siap menjalankan FFmpeg"
          

