
name: Video DCD dengan Foto Antikythera

on:
  workflow_dispatch:

jobs:
  buat-video:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file repositori
        uses: actions/checkout@v4

      - name: Instal FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Periksa foto
        run: |
          ls -lh antikythera.jpg
          ffmpeg -version

      - name: Buat video DCD
        run: |
          ffmpeg -y \
          -loop 1 -framerate 30 -i antikythera.jpg \
          -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0005,1.08)':d=360:s=1080x1920:fps=30,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='MEKANISME ANTIKYTHERA':fontcolor=white:fontsize=52:x=(w-text_w)/2:y=h*0.78:box=1:boxcolor=black@0.55:boxborderw=18" \
          -t 12 -c:v libx264 -pix_fmt yuv420p \
          -movflags +faststart dcd-antikythera.mp4

      - name: Simpan video
        uses: actions/upload-artifact@v4
        with:
          name: Video-DCD-Antikythera
          path: dcd-antikythera.mp4
          retention-days: 7
          
