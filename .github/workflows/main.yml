
name: Tes Video Pertama DCD

on:
  workflow_dispatch:

jobs:
  buat-video:
    runs-on: ubuntu-latest

    steps:
      - name: Instal FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Buat video DCD
        run: |
          ffmpeg -y \
          -f lavfi \
          -i "color=c=0x101827:s=1080x1920:r=30:d=5" \
          -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='DCD - UJI VIDEO PERTAMA':fontcolor=white:fontsize=58:x=(w-text_w)/2:y=(h-text_h)/2" \
          -c:v libx264 \
          -pix_fmt yuv420p \
          -movflags +faststart \
          dcd-uji.mp4

      - name: Simpan hasil video
        uses: actions/upload-artifact@v4
        with:
          name: Video-Percobaan-DCD
          path: dcd-uji.mp4
          retention-days: 7
          
